on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: "Tags"
        required: false
        type: boolean
  release:
    types: [created]

env:
  DOCKER_IMAGE: journez/authorizer
  BUILDKIT_INLINE_CACHE: 1

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # No registry push: Journez doesn't run one (services/*/README and
      # plans/.../phase-5-container-cicd.md -- images are built locally or
      # in CI and transferred straight to the VPS, no Docker Hub, no GHCR
      # yet). This workflow inherited a push to lakhansamani/authorizer --
      # the upstream maintainer's own Docker Hub namespace -- and never got
      # updated after the fork; DOCKER_USERNAME/DOCKER_PASSWORD were never
      # configured in this org's repo either (0 secrets set, confirmed via
      # the GitHub API), so it would have failed at the login step had it
      # ever actually run. Building (not pushing) here just verifies the
      # image is buildable and gives trivy-scan something to scan.
      - name: Build (local only, single platform)
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          VERSION=$(basename "${GITHUB_REF}")
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg VERSION="${VERSION}" \
            --build-arg BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg SOURCE_URL="${SOURCE_URL}" \
            -t "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            .
      - name: Save image for the scan job
        run: docker save "${DOCKER_IMAGE}:${GITHUB_SHA}" -o /tmp/authorizer-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: authorizer-image
          path: /tmp/authorizer-image.tar
          retention-days: 1

  trivy-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: authorizer-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/authorizer-image.tar
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "journez/authorizer:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
